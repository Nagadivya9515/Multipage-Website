<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./timer.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="header">
        <div class="left-logo">
            <img src="../techdialog-3.jpg" alt="" id="logo" />
        </div>
        <div class="right-titles">
            <ul>
                <li id="home"><a href="../index.html">Home</a></li>
                <li id="clock"><a href="./digitalclock.html">Clock</a></li>
                <li id="timer"><a href="./timer.html">Timer</a></li>
                <li id="pomodoro"><a href="./pomodor.html">Pomodoro</a></li>
                <li id="timeline"><a href="./timeline.html">Timeline</a></li>
            </ul>
        </div>
        <a href="./login.html">
        <button id="login" type="submit">Log in</button>
        </a>
    </div>
    <div class="timer">
    <div class="container-3">
      <!-- <h2>00:00:00</h2> -->
       <span id="hrs">00</span>
       <span>:</span>
       <span id="min">00</span>
       <span>:</span>
       <span id="sec">00</span>

      <div class="buttons">
        <i class="fa-solid fa-circle-stop" onclick="watchStop()"></i>
        <i class="fa-solid fa-circle-play" onclick="watchStart()"></i>
        <!-- <i class="fa-solid fa-rotate-right"></i> -->
        <i class="fa-solid fa-circle-check" onclick="watchReset()"></i>
      </div>
    </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
